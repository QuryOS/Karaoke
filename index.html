<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Karaoke</title>
<style>
  html,body{margin:0;height:100%;background:#0b0710;overflow:hidden}
  canvas{display:block;touch-action:none}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#ffd9a0;font:14px system-ui,sans-serif;pointer-events:none;text-shadow:0 1px 3px #000}
  #menu{position:fixed;top:12px;right:12px;z-index:5;padding:10px 14px;border:0;border-radius:12px;background:#d4a24c;color:#1a1020;font:700 15px system-ui,sans-serif}
</style>
</head>
<body>
<button id="menu">&#9835; Menú</button>
<div id="hint">Toca una tableta para abrir el menú · arrastra para mirar alrededor</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="karaoke.js"></script>
<script src="karaoke_ui.js"></script>
<script>
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0710);
  var camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 60);
  camera.position.set(0, 1.7, 5.8);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.4, -3);
  controls.enableDamping = true;
  controls.minDistance = 0.5;
  controls.maxDistance = 11;
  controls.update();

  var karaoke = createKaraoke(THREE);
  scene.add(karaoke.group);

  var ui = createKaraokeUI({
    screen: karaoke.group.userData.screen,   // las pantallas del lugar siguen a la tableta
    catalogUrl: 'musica/songs.json',
    basePath: 'musica/',
    reportEmail: ''                           // pon tu correo para activar "Reportar contenido"
  });
  ui.attachTo(THREE, camera, renderer.domElement, karaoke.group);
  document.getElementById('menu').addEventListener('click', function () { ui.open(); });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  renderer.setAnimationLoop(function () {
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
